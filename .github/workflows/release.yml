name: Release

# Manual-trigger release workflow for the ekryski/mlx-c fork. Computes the
# next version, runs the cmake build (mirrors the gate from `alpha-ci.yml`),
# creates a `release/<tag>` branch (kept open for hotfixes) and an annotated
# tag, then publishes a GitHub Release with auto-generated notes.
#
# Usage: GitHub UI → Actions → "Release" → Run workflow.
#   bump_type:        major / minor / patch
#   prerelease_tag:   alpha / beta / rc / none
#   override_version: optional; bypass auto-bump (e.g. "0.7.0-alpha")
#   notes_baseline:   optional; ref to compare against for release notes
#                     (defaults to GitHub's auto-generation from last tag)
#   tag_prefix:       v (default), auto, or empty

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "minor"
        type: choice
        options: [major, minor, patch]
      prerelease_tag:
        description: "Pre-release suffix (none = stable)"
        required: true
        default: "alpha"
        type: choice
        options: [alpha, beta, rc, none]
      override_version:
        description: "Override version (bypasses auto-bump). E.g. 0.7.0-alpha"
        required: false
        default: ""
      notes_baseline:
        description: "Generate notes since this ref (e.g. 'main'). Empty = since last tag."
        required: false
        default: ""
      tag_prefix:
        description: "Tag prefix. 'v' by convention; 'auto' inherits from last tag."
        required: false
        default: "v"
        type: choice
        options: [v, auto, ""]

permissions:
  contents: write   # tag + release branch + GitHub Release creation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'ekryski'
    name: Build (M1 macOS)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          path: mlx-c
          fetch-depth: 0

      - name: Checkout ekryski/mlx@alpha (override FetchContent source)
        uses: actions/checkout@v6
        with:
          repository: ekryski/mlx
          ref: alpha
          path: mlx

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Cache CMake build directory
        uses: actions/cache@v5
        with:
          path: mlx-c/build
          key: cmake-${{ runner.os }}-${{ hashFiles('mlx-c/CMakeLists.txt', 'mlx/CMakeLists.txt') }}-${{ hashFiles('mlx/mlx/**/*.cpp', 'mlx/mlx/**/*.h', 'mlx/mlx/backend/metal/kernels/**/*.metal') }}
          restore-keys: cmake-${{ runner.os }}-

      - name: Configure
        working-directory: mlx-c
        run: |
          cmake -S . -B build \
            -DFETCHCONTENT_SOURCE_DIR_MLX="${{ github.workspace }}/mlx" \
            -DMLX_C_BUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build mlx-c
        working-directory: mlx-c
        run: cmake --build build -j 2

      - name: Verify build artifacts
        working-directory: mlx-c
        run: |
          ls -la build/*.a build/*.dylib 2>/dev/null | head
          # Confirm fork-specific symbol is present in the static archive.
          nm build/libmlxc.a 2>/dev/null | grep -i "turbo_bulk_dequant_rotated" \
            && echo "OK: ekryski-fork turbo binding linked" \
            || (echo "FAIL: turbo_bulk_dequant_rotated not found"; exit 1)

  release:
    needs: build
    if: github.repository_owner == 'ekryski'
    name: Tag + GitHub Release
    runs-on: macos-26
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      release_branch: ${{ steps.bump.outputs.release_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version + create branch/tag
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          PRERELEASE_TAG: ${{ github.event.inputs.prerelease_tag }}
          OVERRIDE_VERSION: ${{ github.event.inputs.override_version }}
          TAG_PREFIX: ${{ github.event.inputs.tag_prefix }}
        run: ./scripts/release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.bump.outputs.release_branch }}
          NOTES_BASELINE: ${{ github.event.inputs.notes_baseline }}
          PRERELEASE: ${{ github.event.inputs.prerelease_tag != 'none' }}
        run: |
          ARGS=(
            --target "$RELEASE_BRANCH"
            --title "$TAG"
            --generate-notes
          )
          if [ -n "$NOTES_BASELINE" ]; then
            ARGS+=(--notes-start-tag "$NOTES_BASELINE")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}"

      - name: Summary
        run: |
          echo "### Released ${{ steps.bump.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ steps.bump.outputs.release_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.bump.outputs.commit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.bump.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
